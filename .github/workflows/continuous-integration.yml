name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and container
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SERVING_BUNDLE_ROOT: ${{ github.workspace }}/deployment/serving_bundle

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.2"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -m pip check

      - name: Build serving test bundle
        run: |
          python scripts/build_serving_test_bundle.py

      - name: Check Python syntax
        run: |
          python -m compileall -q api orchestration scripts tests

      - name: Run automated tests
        run: |
          python -m unittest discover \
            -s tests \
            -p "test_*.py" \
            -v

      - name: Validate Compose configuration
        run: |
          docker compose config --quiet

      - name: Build and start container
        run: |
          docker compose up --detach --build --wait

      - name: Verify container prediction
        run: |
          python scripts/smoke_test_serving_api.py

      - name: Stop container
        if: always()
        run: |
          docker compose down --volumes